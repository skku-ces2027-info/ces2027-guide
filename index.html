<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CES 2027 연수단 안내</title>
<meta name="description" content="CES 2027(1/6~8) 세션·키노트·입장 규칙·기한을 필터로 찾고 원문으로 가는 연수단 안내판">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=20261104h">
</head>
<body>
<div class="mobile" role="note">데스크탑에서 열어 주세요. 휴대폰 화면은 준비 중입니다.</div>
<div class="wrap">
  <header class="top">
    <span class="brand">CES 2027 연수단 안내</span>
    <div class="right">
      <span id="stamp"></span>
      <button class="log-btn" id="logBtn" aria-expanded="false" aria-controls="logSheet">업데이트</button>
      <div class="sheet" id="logSheet" role="dialog" aria-label="업데이트 기록"></div>
    </div>
  </header>

  <h1>CES 2027 · 1월 6일(수)~8일(금)</h1>
  <ul class="dues" id="dues"></ul>
  <p class="note">CES 공식 페이지와 보도를 모아 정리한 공개 정보입니다.</p>

  <div class="main">
    <aside class="side" aria-label="필터">
      <label class="search"><span class="sr">검색</span><input id="q" type="search" placeholder="검색 (제목·요약·방 번호)" autocomplete="off"></label>
      <div id="filters"></div>
      <div class="side-foot">
        <button class="link" id="reset">필터 지우기</button>
        <button class="link" id="copy">이 조건 링크 복사</button>
      </div>
    </aside>
    <section class="list" aria-live="polite">
      <div class="list-head"><span id="count"></span></div>
      <div id="groups"></div>
    </section>
  </div>

  <p class="foot">시각·방은 CES 사정으로 1월까지 바뀔 수 있습니다. 출국 직전 CES 앱에서 다시 확인하세요. 항목마다 원문 링크와 확인한 날짜를 적었습니다. 지도 데이터 © OpenStreetMap 기여자.</p>
</div>
<dialog id="mapDlg" aria-labelledby="mapTitle">
  <div class="dlg-head">
    <div><strong id="mapTitle"></strong><span id="mapPlace"></span></div>
    <button type="button" class="link" id="mapClose">닫기</button>
  </div>
  <div class="chips" id="mapTabs"></div>
  <div class="stage"><img id="mapImg" alt="라스베이거스 전시장 지도"><i class="pin" id="mapPin"></i></div>
</dialog>
<script src="app.js?v=20261104h"></script>
</body>
</html>
